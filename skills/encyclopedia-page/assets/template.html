<!doctype html>
<!--
  encyclopedia-page template.
  Fill the {{SLOTS}} and replace everything between BEGIN ARTICLE and END ARTICLE.
  The table of contents, section numbering, UI strings (by <html lang>), math rendering
  and the active-section highlight are generated by the script at the bottom: do not hand-write them.
-->
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{SHORT_TITLE}}</title>
<!-- KaTeX: harmless if the page has no math; remove these three lines to stay fully offline. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
:root{
  --bg:#ffffff; --bg-soft:#f8f9fa; --bg-chrome:#f6f6f6; --bg-head:#eaecf0; --line:#a2a9b1; --line-soft:#c8ccd1;
  --text:#202122; --muted:#54595d; --link:#3366cc;
  --note-bg:#eaf3ff; --note-line:#3366cc; --warn-bg:#fef6e7; --warn-line:#edab00;
  --good-bg:#d5fdf4; --good-line:#14866d; --ib-band:#dfe6f2; --figure-bg:#ffffff;
  --accent:#edab00; --accent-2:#3366cc; --accent-3:#14866d; --accent-4:#d73333;
  --serif:"Linux Libertine","Georgia","Times",serif;
  --sans:-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101418; --bg-soft:#1b1f24; --bg-chrome:#202328; --bg-head:#2a2f36; --line:#5b626b; --line-soft:#3a4048;
    --text:#eaecf0; --muted:#a2a9b1; --link:#88a3e8;
    --note-bg:#16233a; --note-line:#6485d1; --warn-bg:#2e2611; --warn-line:#c99a1f;
    --good-bg:#10302a; --good-line:#3aa58a; --ib-band:#26303f; --figure-bg:#1b1f24;
  }
}
:root[data-theme="dark"]{
  --bg:#101418; --bg-soft:#1b1f24; --bg-chrome:#202328; --bg-head:#2a2f36; --line:#5b626b; --line-soft:#3a4048;
  --text:#eaecf0; --muted:#a2a9b1; --link:#88a3e8;
  --note-bg:#16233a; --note-line:#6485d1; --warn-bg:#2e2611; --warn-line:#c99a1f;
  --good-bg:#10302a; --good-line:#3aa58a; --ib-band:#26303f; --figure-bg:#1b1f24;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6}
a{color:var(--link);text-decoration:none} a:hover{text-decoration:underline}

/* header */
.header{display:flex;align-items:center;gap:16px;padding:10px 24px;border-bottom:1px solid var(--line-soft)}
.logo{display:flex;align-items:center;gap:10px;color:var(--text)}
.logo:hover{text-decoration:none}
.logo .name{font-family:var(--serif);font-size:21px;letter-spacing:.06em;text-transform:uppercase;line-height:1.1}
.logo .tag{font-size:11.5px;color:var(--muted);line-height:1.1}
.search{flex:1;max-width:520px;margin-left:24px;display:flex}
.search input{flex:1;min-width:0;border:1px solid var(--line);border-radius:2px 0 0 2px;padding:6px 10px;font:inherit;font-size:14px;background:var(--bg);color:var(--text)}
.search button{border:1px solid var(--line);border-left:0;background:var(--bg-chrome);padding:6px 14px;font:inherit;font-size:14px;border-radius:0 2px 2px 0;color:var(--text)}
.theme-btn{margin-left:auto;border:1px solid var(--line-soft);background:var(--bg-chrome);color:var(--text);border-radius:2px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer}

/* layout */
.page{display:grid;grid-template-columns:230px minmax(0,1fr);max-width:1400px;margin:0 auto}
.sidebar{padding:18px 14px 40px 24px;font-size:13.5px}
.sidebar .sticky{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}
.sidebar h4{font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px;padding-bottom:4px;border-bottom:1px solid var(--line-soft)}
.sidebar ol{list-style:none;margin:0;padding:0}
.sidebar li{margin:3px 0}
.sidebar li li{padding-left:12px;font-size:13px}
.sidebar a.active{color:var(--text);font-weight:600}
main{padding:0 32px 60px;min-width:0}
.tabs{display:flex;justify-content:space-between;border-bottom:1px solid var(--line-soft);font-size:13.5px;margin-top:6px}
.tabs div{display:flex}
.tabs span{padding:8px 10px;color:var(--link)}
.tabs span.sel{color:var(--text);border-bottom:2px solid var(--text)}

/* typography */
h1{font-family:var(--serif);font-weight:400;font-size:29px;line-height:1.3;margin:14px 0 2px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.from{font-size:12.5px;color:var(--muted);margin:4px 0 14px}
h2{font-family:var(--serif);font-weight:400;font-size:23px;margin:30px 0 10px;padding-bottom:3px;border-bottom:1px solid var(--line);overflow:hidden}
h3{font-size:16.5px;font-weight:700;margin:22px 0 6px}
p{margin:8px 0 12px}
.hatnote{font-style:italic;padding-left:1.6em;margin-bottom:10px}
sup.ref{font-size:11px;line-height:1}
sup.ref a::before{content:"["} sup.ref a::after{content:"]"}
.lead-term{font-weight:700}

/* infobox */
.infobox{float:right;clear:right;width:300px;margin:4px 0 16px 22px;border:1px solid var(--line);background:var(--bg-soft);font-size:13px;line-height:1.45;padding:4px}
.infobox .ib-title{font-family:var(--serif);font-size:17px;font-weight:700;text-align:center;padding:6px 4px}
.infobox .ib-title.band{background:var(--ib-band)}
.infobox .ib-media{background:var(--figure-bg);border:1px solid var(--line-soft);padding:6px;text-align:center;overflow-x:auto}
.infobox .ib-media svg,.infobox .ib-media img{max-width:100%;height:auto;display:block;margin:0 auto}
.infobox .cap{font-size:12px;color:var(--muted);text-align:center;padding:4px 6px 6px}
.infobox table{width:100%;border-collapse:collapse}
.infobox th{text-align:left;vertical-align:top;padding:4px 6px;width:38%;font-weight:700}
.infobox td{padding:4px 6px;vertical-align:top}
.infobox .ib-head{background:var(--ib-band);text-align:center;font-weight:700;padding:4px}

/* boxes */
.box{border:1px solid var(--line-soft);border-left:4px solid var(--note-line);background:var(--note-bg);padding:10px 14px;margin:14px 0;overflow-x:auto}
.box.warn{border-left-color:var(--warn-line);background:var(--warn-bg)}
.box.good{border-left-color:var(--good-line);background:var(--good-bg)}
.box .bt{font-weight:700;margin-bottom:4px;display:block}
.analogy{border:1px solid var(--line-soft);background:var(--bg-soft);padding:10px 14px;margin:14px 0}
.analogy .bt{font-weight:700;display:block;margin-bottom:4px}
.analogy .bt::before{content:"🧭  "}

/* math */
.eq{overflow-x:auto;overflow-y:hidden;padding:4px 0;margin:8px 0}
.eqnum{display:flex;align-items:center;gap:12px}
.eqnum .eq{flex:1;min-width:0}
.eqnum .n{color:var(--muted);font-size:13.5px;flex:none}

/* tables */
.tscroll{overflow-x:auto}
table.wt{border-collapse:collapse;margin:12px 0;background:var(--bg-soft);font-size:14px;max-width:100%}
table.wt caption{font-weight:700;padding:4px;text-align:left}
table.wt th,table.wt td{border:1px solid var(--line);padding:6px 10px;vertical-align:top}
table.wt th{background:var(--bg-head);text-align:center}
table.wt tr.hl{background:var(--warn-bg)}

/* figures */
figure.thumb{margin:14px 0;border:1px solid var(--line-soft);background:var(--bg-soft);padding:6px}
figure.thumb.right{float:right;clear:right;width:340px;margin-left:22px}
figure.thumb svg,figure.thumb img{display:block;width:100%;height:auto;background:var(--figure-bg);border:1px solid var(--line-soft)}
figure.thumb figcaption{font-size:12.5px;line-height:1.45;padding:6px 2px 2px}
/* SVG text and strokes follow the theme when they use these classes */
svg .t{fill:var(--text)} svg .tm{fill:var(--muted)} svg .ln{stroke:var(--muted)} svg .grid{stroke:var(--line-soft)}
svg .card{fill:var(--bg-soft);stroke:var(--line)} svg .card-a{fill:var(--note-bg);stroke:var(--note-line)} svg .card-w{fill:var(--warn-bg);stroke:var(--warn-line)} svg .card-g{fill:var(--good-bg);stroke:var(--good-line)}

/* spoiler, calculator, gallery */
details.spoiler{border:1px solid var(--line-soft);background:var(--bg-soft);margin:10px 0}
details.spoiler summary{cursor:pointer;padding:8px 12px;font-weight:600;color:var(--link)}
details.spoiler[open] summary{border-bottom:1px solid var(--line-soft)}
details.spoiler > div{padding:8px 14px}
.calc{border:1px solid var(--line);background:var(--bg-soft);padding:12px 14px;margin:14px 0}
.calc label{font-weight:600;margin-right:8px}
.calc select,.calc input{font:inherit;padding:3px 6px;background:var(--bg);color:var(--text);border:1px solid var(--line)}
.calc .out{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:10px}
.calc .cell{background:var(--bg);border:1px solid var(--line-soft);padding:8px}
.calc .cell .k{font-size:12px;color:var(--muted)}
.calc .cell .v{font-size:18px;font-family:var(--serif)}
.calc .msg{margin-top:8px;font-size:14px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin:14px 0}
.gallery figure{margin:0;border:1px solid var(--line-soft);background:var(--bg-soft);padding:6px}
.gallery svg,.gallery img{width:100%;height:auto;display:block;background:var(--figure-bg)}
.gallery figcaption{font-size:12.5px;padding-top:4px}

/* end matter */
dl.glossary dt{font-weight:700;margin-top:6px}
dl.glossary dd{margin:0 0 4px 1.6em}
.reflist{font-size:13.5px}
.reflist li{margin:4px 0}
.seealso{columns:2 220px;font-size:14px}
.navbox{clear:both;border:1px solid var(--line);margin-top:24px;font-size:13px}
.navbox .nb-title{background:var(--ib-band);text-align:center;font-weight:700;padding:4px}
.navbox .nb-row{display:grid;grid-template-columns:160px 1fr;border-top:1px solid var(--line-soft)}
.navbox .nb-row > div:first-child{background:var(--bg-head);font-weight:700;padding:4px 8px}
.navbox .nb-row > div:last-child{padding:4px 8px}
.catlinks{clear:both;border:1px solid var(--line);background:var(--bg-soft);padding:6px 10px;font-size:13px;margin-top:24px}
.footer{border-top:1px solid var(--line-soft);margin-top:24px;padding-top:10px;font-size:12px;color:var(--muted)}

@media (max-width:900px){
  .page{grid-template-columns:1fr}
  .sidebar{display:none}
  main{padding:0 16px 40px}
  .infobox,figure.thumb.right{float:none;width:100%;margin:10px 0}
  .header{padding:10px 16px;flex-wrap:wrap}
  .search{margin-left:0;order:3;max-width:none;width:100%}
  .navbox .nb-row{grid-template-columns:1fr}
}
@media print{.header,.sidebar,.tabs,.theme-btn{display:none}.page{display:block}details.spoiler{display:none}}
</style>
</head>
<body>

<header class="header">
  <a class="logo" href="#top" aria-label="{{BRAND}}">
    <!-- {{LOGO_SVG}}: a small original 44x44 SVG emblem related to the brand. Never the Wikipedia puzzle globe. -->
    <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true">
      <circle cx="22" cy="22" r="20" fill="none" stroke="currentColor" stroke-opacity=".45"/>
      <path d="M12 30 L22 10 L32 30 Z" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <circle cx="22" cy="24" r="3.2" fill="#edab00"/>
    </svg>
    <span><span class="name">{{BRAND}}</span><br><span class="tag">{{TAGLINE}}</span></span>
  </a>
  <form class="search" onsubmit="return false"><input data-i18n-ph="search" aria-label="search"><button type="button" data-i18n="searchBtn"></button></form>
  <button class="theme-btn" type="button" id="themeBtn" aria-label="theme">◐</button>
</header>

<div class="page" id="top">
  <nav class="sidebar" aria-label="toc">
    <div class="sticky"><h4 data-i18n="contents"></h4><ol id="toc"></ol></div>
  </nav>

<main>
  <div class="tabs"><div><span class="sel" data-i18n="article"></span><span data-i18n="talk"></span></div><div><span class="sel" data-i18n="read"></span><span data-i18n="edit"></span><span data-i18n="history"></span></div></div>

  <h1>{{PAGE_TITLE}}</h1>
  <div class="from"><span data-i18n="from"></span> {{BRAND}}</div>

<!-- BEGIN ARTICLE ============================================================
     Replace this whole block. Order: hatnote → infobox → lead (2–4 paragraphs) →
     h2 sections (each with an id) → glossary → references → see also → navbox → categories.
     Component snippets: references/components.md
============================================================================== -->

  <div class="hatnote">{{HATNOTE}}</div>

  <aside class="infobox">
    <div class="ib-title band">{{INFOBOX_TITLE}}</div>
    <div class="ib-media"><!-- inline SVG illustration --></div>
    <div class="cap">{{CAPTION}}</div>
    <table>
      <tr><td colspan="2" class="ib-head">{{GROUP}}</td></tr>
      <tr><th>{{KEY}}</th><td>{{VALUE}}</td></tr>
    </table>
  </aside>

  <p><span class="lead-term">{{TERM}}</span> {{LEAD}}<sup class="ref"><a href="#ref-1">1</a></sup></p>

  <h2 id="section-1">{{SECTION}}</h2>
  <p>…</p>

  <h2 id="references" data-i18n="references"></h2>
  <ol class="reflist">
    <li id="ref-1">{{REFERENCE}}</li>
  </ol>

  <div class="catlinks"><span data-i18n="categories"></span>: <a href="#">{{CATEGORY}}</a></div>

<!-- END ARTICLE ============================================================== -->

  <div class="footer">{{BRAND}} — <span data-i18n="disclaimer"></span></div>
</main>
</div>

<script>
(function(){
  var I18N = {
    es:{search:"Buscar en ",searchBtn:"Buscar",contents:"Contenidos",start:"(Inicio)",article:"Artículo",talk:"Discusión",read:"Leer",edit:"Editar",history:"Ver historial",from:"De",references:"Referencias",categories:"Categorías",disclaimer:"página explicativa generada con apariencia de enciclopedia. Nombre ficticio, sin relación con la Fundación Wikimedia ni con Wikipedia."},
    en:{search:"Search ",searchBtn:"Search",contents:"Contents",start:"(Top)",article:"Article",talk:"Talk",read:"Read",edit:"Edit",history:"View history",from:"From",references:"References",categories:"Categories",disclaimer:"an explainer page styled like an encyclopedia. Fictional name, not affiliated with the Wikimedia Foundation or Wikipedia."},
    pt:{search:"Pesquisar em ",searchBtn:"Pesquisar",contents:"Conteúdo",start:"(Topo)",article:"Artigo",talk:"Discussão",read:"Ler",edit:"Editar",history:"Ver histórico",from:"Origem:",references:"Referências",categories:"Categorias",disclaimer:"página explicativa com aparência de enciclopédia. Nome fictício, sem relação com a Fundação Wikimedia ou a Wikipédia."},
    fr:{search:"Rechercher sur ",searchBtn:"Rechercher",contents:"Sommaire",start:"(Début)",article:"Article",talk:"Discussion",read:"Lire",edit:"Modifier",history:"Historique",from:"Un article de",references:"Références",categories:"Catégories",disclaimer:"page explicative au style d'encyclopédie. Nom fictif, sans lien avec la Wikimedia Foundation ni Wikipédia."}
  };
  var lang = (document.documentElement.lang||"en").slice(0,2).toLowerCase();
  var S = I18N[lang] || I18N.en;
  var brand = (document.querySelector(".logo .name")||{}).textContent || "";
  document.querySelectorAll("[data-i18n]").forEach(function(e){ if(!e.textContent.trim()) e.textContent = S[e.getAttribute("data-i18n")] || ""; });
  document.querySelectorAll("[data-i18n-ph]").forEach(function(e){ e.placeholder = S.search + brand; });

  // theme toggle (per-viewer convenience only)
  var root = document.documentElement;
  try { var saved = localStorage.getItem("enc-theme"); if (saved) root.setAttribute("data-theme", saved); } catch(e){}
  document.getElementById("themeBtn").addEventListener("click", function(){
    var dark = root.getAttribute("data-theme") ? root.getAttribute("data-theme")==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    var next = dark ? "light" : "dark"; root.setAttribute("data-theme", next);
    try { localStorage.setItem("enc-theme", next); } catch(e){}
  });

  // TOC: numbered from h2/h3 inside <main>; ids are created when missing
  function slug(t){ return t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "s"; }
  var toc = document.getElementById("toc"), heads = document.querySelectorAll("main h2, main h3");
  var li0 = document.createElement("li"); li0.innerHTML = '<a href="#top">'+S.start+'</a>'; toc.appendChild(li0);
  var n2 = 0, n3 = 0, cur = null, used = {};
  heads.forEach(function(h){
    if (!h.id) { var b = slug(h.textContent), id = b, k = 2; while (used[id] || document.getElementById(id)) id = b + "-" + (k++); h.id = id; }
    used[h.id] = 1;
    var a = document.createElement("a"); a.href = "#" + h.id;
    var li = document.createElement("li");
    if (h.tagName === "H2") { n2++; n3 = 0; a.textContent = n2 + " " + h.textContent; li.appendChild(a); toc.appendChild(li); cur = document.createElement("ol"); li.appendChild(cur); }
    else { n3++; a.textContent = n2 + "." + n3 + " " + h.textContent; li.appendChild(a); (cur || toc).appendChild(li); }
  });
  var links = Array.prototype.slice.call(toc.querySelectorAll("a"));
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function(es){ es.forEach(function(e){ if (e.isIntersecting) links.forEach(function(a){ a.classList.toggle("active", a.getAttribute("href") === "#" + e.target.id); }); }); }, {rootMargin:"0px 0px -75% 0px"});
    heads.forEach(function(h){ io.observe(h); });
  }

  document.addEventListener("DOMContentLoaded", function(){
    if (window.renderMathInElement) renderMathInElement(document.body, {
      delimiters:[{left:"$$",right:"$$",display:true},{left:"$",right:"$",display:false}],
      ignoredTags:["script","noscript","style","textarea","option","svg"], throwOnError:false
    });
  });
})();
</script>
<!-- Page-specific scripts (calculators, generated plots) go below this line. -->
</body>
</html>
